name: Android APK

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install root deps + vendor bundle
        run: |
          npm ci
          npm run vendor
          npx cap sync android

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 36
          build-tools: 36.0.0

      - name: Build debug APK
        working-directory: android
        run: .\gradlew.bat assembleDebug --no-daemon

      - name: Verify debug APK
        run: Get-Item android\app\build\outputs\apk\debug\app-debug.apk | Select-Object Name,Length

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Build signed release (optional)
        if: github.event_name == 'push' || github.ref == 'refs/heads/master'
        env:
          STORE_FILE: release.keystore
        run: |
          # Decode keystore from secret if provided
          if ($env:ANDROID_KEYSTORE_BASE64) {
            [IO.File]::WriteAllBytes("android/$env:STORE_FILE", [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64))
            'storeFile=release.keystore' | Out-File -FilePath android/keystore.properties -Encoding ascii
            "storePassword=$env:ANDROID_KEYSTORE_PASSWORD" | Add-Content android/keystore.properties
            "keyAlias=$env:ANDROID_KEY_ALIAS" | Add-Content android/keystore.properties
            "keyPassword=$env:ANDROID_KEY_PASSWORD" | Add-Content android/keystore.properties
          }
          .\android\gradlew.bat assembleRelease --no-daemon
        continue-on-error: true

      - if: hashFiles('android/release.keystore') != ''
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 14
