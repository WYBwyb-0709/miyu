# Project-wide Gradle settings.
# 3GB total RAM — cap Gradle JVM at 800m, 1 worker, and skip parallel compilation.
org.gradle.jvmargs=-Xmx800m -XX:+UseSerialGC -Dfile.encoding=UTF-8
org.gradle.workers.max=1
org.gradle.parallel=false
android.useAndroidX=true
# Capacitor plugin modules require a Java 21 toolchain; JDK 21 lives on F: drive.
org.gradle.java.home=F\:\\miyu-builds\\jdk21\\jdk-21.0.2
org.gradle.java.installations.paths=F\:\\miyu-builds\\jdk21\\jdk-21.0.2,C\:\\Users\\win10\\AppData\\Local\\android-build\\jdk-17.0.20.1+1
# Cache and build output go to F: to spare C: space.
org.gradle.caching=true
org.gradle.caching.directory=F\:\\gradle-cache
org.gradle.project.buildDir=F\:\\miyu-builds\\android-build
android.defaults.buildfeatures.buildconfig=false
android.nonTransitiveRClass=false
